<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Måendekoll — historik</title>
<style>
  :root {
    --green: #2E7D32; --green-bg: #E8F5E9;
    --yellow: #B8860B; --yellow-bg: #FFF8E1;
    --red: #C62828; --red-bg: #FDECEA;
    --ink: #1B2430; --slate: #5B6B79; --line: #DADFE3; --paper: #F7F8FA;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--paper);
    color: var(--ink);
    padding: 24px 16px 60px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  .sub { color: var(--slate); font-size: 14px; margin: 0 0 24px; }
  #loading { color: var(--slate); font-size: 14px; }
  #empty { color: var(--slate); font-size: 14px; display: none; }

  .entry {
    background: #fff; border: 1px solid var(--line); border-radius: 12px;
    padding: 16px 18px; margin-bottom: 12px;
  }
  .entry-date {
    font-size: 13px; color: var(--slate); margin: 0 0 10px; font-weight: 600;
  }
  .rows { display: flex; flex-direction: column; gap: 6px; }
  .row { display: flex; align-items: center; gap: 8px; font-size: 14px; }
  .row .label { color: var(--slate); min-width: 120px; }
  .pill {
    font-size: 12.5px; padding: 3px 10px; border-radius: 20px; font-weight: 600;
  }
  .pill.green { background: var(--green-bg); color: var(--green); }
  .pill.yellow { background: var(--yellow-bg); color: var(--yellow); }
  .pill.red { background: var(--red-bg); color: var(--red); }
</style>
</head>
<body>
<div class="wrap">
  <h1>Måendekoll — historik</h1>
  <p class="sub">Senaste ifyllda loggarna, nyast överst.</p>
  <div id="loading">Laddar...</div>
  <div id="empty">Inga loggar ännu.</div>
  <div id="list"></div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
  import { getFirestore, collection, query, orderBy, limit, getDocs } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

  // ---- KLISTRA IN SAMMA FIREBASE-CONFIG SOM I index.html ----
  const firebaseConfig = {
    apiKey: "AIzaSyABOkPHmNsjqD4UeUHmrXhoLoLaXZMqK64",
    authDomain: "linns-mood-tracker.firebaseapp.com",
    projectId: "linns-mood-tracker",
    storageBucket: "linns-mood-tracker.firebasestorage.app",
    messagingSenderId: "543477521195",
    appId: "1:543477521195:web:752c1cf1c8ca0b6cbf836e"
  };
  // -------------------------------------------------------------

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  const CATS = ["Humör", "Trötthet", "Mentalt mående", "Aptit"];
  const GREEN_VALS = ["Bra", "Pigg"];
  const YELLOW_VALS = ["Sisådär", "Lite trött"];

  function colorFor(val) {
    if (GREEN_VALS.includes(val)) return 'green';
    if (YELLOW_VALS.includes(val)) return 'yellow';
    return 'red';
  }

  async function load() {
    const q = query(collection(db, 'entries'), orderBy('timestamp', 'desc'), limit(100));
    const snap = await getDocs(q);
    document.getElementById('loading').style.display = 'none';

    if (snap.empty) {
      document.getElementById('empty').style.display = 'block';
      return;
    }

    const list = document.getElementById('list');
    snap.forEach(doc => {
      const data = doc.data();
      const div = document.createElement('div');
      div.className = 'entry';

      const dateStr = data.timestamp
        ? data.timestamp.toDate().toLocaleString('sv-SE', { dateStyle: 'medium', timeStyle: 'short' })
        : 'Okänt datum';

      let rowsHtml = '';
      CATS.forEach(cat => {
        if (data[cat]) {
          rowsHtml += `<div class="row"><span class="label">${cat}</span><span class="pill ${colorFor(data[cat])}">${data[cat]}</span></div>`;
        }
      });

      div.innerHTML = `<p class="entry-date">${dateStr}</p><div class="rows">${rowsHtml}</div>`;
      list.appendChild(div);
    });
  }

  load().catch(() => {
    document.getElementById('loading').textContent = 'Kunde inte ladda historiken. Kontrollera internetuppkopplingen.';
  });
</script>
</body>
</html>
